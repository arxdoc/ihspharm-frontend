<div class="ios-page">
  <header class="ios-navbar">
    <a
      class="ios-back"
      [routerLink]="['/salas', salaId(), 'pacientes', pacienteId(), 'planes', planId()]"
    >‹ Plan</a>
    <h1 class="ios-title">Comunicaciones</h1>
  </header>

  <app-contexto-card [items]="contexto()" />

  <p class="ios-section-title">Comunicación</p>
  <form class="ios-compose ios-compose--stacked" (ngSubmit)="enviar()">
    <textarea
      class="ios-textarea"
      rows="6"
      name="mensaje"
      [ngModel]="mensaje()"
      (ngModelChange)="onMensajeChange($event)"
    ></textarea>
    <button type="submit" class="ios-send-btn" [disabled]="!mensaje().trim()">Enviar</button>
  </form>

  <p class="ios-section-title">Enviadas</p>
  <ul class="ios-list">
    @for (c of comunicaciones(); track $index) {
      <li class="ios-row">
        <div class="ios-row-body">
          <div class="ios-row-title">{{ c.texto }}</div>
          <div class="ios-row-subtitle">{{ c.hora }}</div>
        </div>
      </li>
    } @empty {
      <li class="ios-state">Sin comunicaciones todavía.</li>
    }
  </ul>
</div>
